[package]
name = "workpet"
version = "1.0.3"
edition = "2021"
description = "Work Pet · 多 AI Agent 签到与账号管理宠物"
license = "MIT"

[lib]
name = "workpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅访问 http://127.0.0.1 的本地 daemon，无需 TLS；禁用默认 rustls 避免 ring 需要 C 编译器
ureq = { version = "3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
