name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+：daemon 的 CodeArts Agent 账号切换依赖内置 node:sqlite（读写 state.vscdb）
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Bundle Node.js runtime and scripts (flat packaging)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-ui/src-tauri/binaries | Out-Null
          Copy-Item "C:/Program Files/nodejs/node.exe" desktop-ui/src-tauri/binaries/node.exe
          Copy-Item "daemon.js" desktop-ui/src-tauri/daemon.js
          Copy-Item "credit-segments.js" desktop-ui/src-tauri/credit-segments.js

      - name: Install dependencies
        working-directory: desktop-ui
        run: npm install

      - name: Build (NSIS installer)
        working-directory: desktop-ui
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workpet-windows
          path: |
            desktop-ui/src-tauri/target/release/workpet.exe
            desktop-ui/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release (tag push only; beta/rc/alpha tags -> prerelease)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $isPre = $tag -match '-(beta|rc|alpha)'
          $installer = Get-ChildItem -Path "desktop-ui/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($installer) {
            $title = if ($isPre) { "WorkPet $tag (Testing)" } else { "WorkPet $($tag.TrimStart('v'))" }
            $extra = if ($isPre) { @('--prerelease') } else { @() }
            gh release create "$tag" "$($installer.FullName)#$($installer.Name)" --repo "${{ github.repository }}" --title "$title" --notes "WorkPet $tag 自动构建" @extra || gh release upload "$tag" "$($installer.FullName)#$($installer.Name)" --clobber --repo "${{ github.repository }}"
          }
